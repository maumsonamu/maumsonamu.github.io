  name_en: Maum Sonamu Psychological Research & Counseling
  short: 마음소나무
  tagline: 소나무처럼, 계절이 바뀌어도 당신 곁에 서 있는 상담.
  lead: 전화와 화상으로 만나는 예약제 전문 심리상담입니다. 어디에 계시든, 조용한 방 하나만 있으면 상담이 시작됩니다. 원하시면 사전 약속 후 대면 상담도 가능합니다.
  description: 마음소나무 심리연구상담소 — 전화·화상 예약제 전문 심리상담. 성인·노인 상담, 이명 심리상담, 삶의 방향 상담. 주관적 중요도·시대심리학 연구.
  keywords: 마음소나무, 마음소나무 심리연구상담소, 심리상담, 온라인 심리상담, 화상 상담, 전화 상담, 이명 심리상담, 노인 상담, 성인 상담, 주관적 중요도, 시대심리학


# ---------- 첫 화면 세 가지 약속 ----------
promises:
  - title: 예약제
    desc: 모든 상담은 사전 예약으로 진행됩니다. 기다림 없이, 온전히 당신을 위한 시간입니다.
  - title: 전화 · 화상
    desc: 거리와 이동의 부담 없이 익숙한 공간에서 상담받습니다. 대면 상담은 요청 시 사전 약속 후 가능합니다.
  - title: 연구에 근거한 상담
    desc: 상담소가 직접 연구하는 이론과 임상 근거를 바탕으로 상담합니다.


# ---------- 상담 영역 ----------
services:
  - title: 성인 심리상담
    desc: 불안, 우울, 스트레스, 관계의 어려움, 번아웃. 지금의 고통을 함께 정리하고 다룰 수 있는 크기로 나눕니다.
    tags: [불안·우울, 대인관계, 직장 스트레스]
  - title: 노인 심리상담
    desc: 은퇴와 역할 변화, 상실과 애도, 외로움, 기억력 걱정. 인생 후반의 마음을 존중하며 천천히 듣습니다.
    tags: [상실·애도, 은퇴 적응, 외로움]
  - title: 이명 심리상담
    desc: 이명 소리 자체보다 그 소리에 묶여 버린 마음을 다룹니다. 의학적 진단 이후에도 남는 고통, 불면, 집중의 어려움을 함께 풀어갑니다.
    tags: [이명 고통, 불면, 주의 조절]
  - title: 삶의 방향 상담
    desc: 무엇이 나에게 정말 중요한지 모르겠을 때. 하고 싶은 것과 잘하는 것을 적어 하나의 맥락으로 모으고, 현실에서 실현할 길을 찾습니다.
    tags: [가치 탐색, 진로·전환기, 중년의 질문]


# ---------- 상담 진행 방식 ----------
process:
  - name: 예약 신청
    desc: 전화, 문자, 카카오톡 채널 또는 예약 양식으로 희망 날짜와 상담 방식(전화/화상)을 알려주세요.
  - name: 사전 안내
    desc: 상담소에서 연락드려 일정과 방식을 확정하고, 화상 상담이면 접속 방법을 안내합니다.
  - name: 상담 진행
    desc: 약속한 시간에 전화를 드리거나 화상으로 만납니다. 1회 50분입니다.
  - name: 이후 계획
    desc: 상담 마무리에 다음 일정과 그 사이에 해볼 것을 함께 정합니다.

# 대면 상담 안내 (첫 화면과 진행 방식 아래에 표시)
in_person: 대면 상담을 원하시면 예약 시 말씀해 주세요. 사전 약속 후 장소와 시간을 조율해 진행합니다.


