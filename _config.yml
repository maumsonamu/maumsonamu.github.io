# 온라인 상담 준비물
prep:
  - 방해받지 않는 조용한 공간
  - 이어폰 또는 헤드셋 (주변에 소리가 새지 않도록)
  - 안정적인 인터넷 또는 통화 환경
  - 메모할 종이와 펜


# ---------- 자주 묻는 질문 ----------
faq:
  - q: 지금 예약할 수 있나요?
    a: 아직 준비 중입니다. 예약이 열리면 첫 화면과 공지에 안내하고, 전화·카카오톡·온라인 양식 중 편한 방법으로 신청하실 수 있게 할 예정입니다.
  - q: 대면 상담도 가능한가요?
    a: 가능합니다. 기본은 전화·화상 상담이지만, 예약 시 대면을 요청하시면 사전 약속 후 장소와 시간을 조율해 진행합니다.
  - q: 화상 상담은 어떻게 하나요?
    a: 예약이 확정되면 접속 링크를 보내드립니다. 별도 가입 없이 스마트폰이나 PC에서 링크를 누르면 됩니다. 처음이 걱정되시면 상담 전 5분 연결 테스트를 해드립니다.
  - q: 이명 상담은 이명을 없애 주나요?
    a: 아닙니다. 이명의 의학적 치료는 이비인후과의 영역입니다. 상담은 이명 때문에 생긴 불안, 불면, 집중의 어려움과 '벗어날 수 없다'는 느낌을 다루어, 소리가 있어도 삶이 다시 움직이도록 돕습니다.
  - q: 상담은 몇 회 정도 받나요?
    a: 사람마다 다릅니다. 첫 회에 어려움을 함께 정리한 뒤 대략의 회기와 간격을 상의해 정합니다. 중간에 조정할 수 있습니다.
  - q: 지금 너무 힘든데 당장 연락해도 되나요?
    a: 상담소는 예약제라 즉시 응답이 어려울 수 있습니다. 지금 위험하다고 느끼신다면 아래 긴급 연락처로 먼저 전화해 주세요. 24시간 연결됩니다.


