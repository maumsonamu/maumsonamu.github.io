# ---------- 연구 ----------
research_intro: 마음소나무는 상담소이자 연구소입니다. 성인과 노인, 그리고 사회를 대상으로 세 가지 주제를 연구하고, 그 결과를 상담에 되돌려 씁니다.
research:
  - title: 이명의 심리학
    subtitle: 소리는 귀에서 나지만, 고통은 마음에서 커집니다
    desc: 이명은 실재하는 증상입니다. 그러나 삶을 멈추게 하는 것은 소리의 크기가 아니라, 뇌가 그 소리를 '중요한 신호'로 붙들고 민감도를 키우면서 생기는 속박감입니다. 우리는 이명에 부여된 중요도를 낮추고 주의를 되돌리는 심리적 경로를 연구합니다.
    note: 이명은 먼저 이비인후과 등에서 의학적 평가를 받으셔야 합니다. 상담은 치료를 대신하지 않으며, 진단 이후에도 남는 심리적 고통을 다룹니다.
  - title: 주관적 중요도(SI) 이론
    subtitle: 가칭 · 연구 진행 중
    desc: 사람은 매 순간 자신이 중요하다고 여기는 것을 실현하려고 선택하고 시도합니다. 시도가 충족되면 그 중요도는 강화되어 성장이 되고, 좌절되어 갇히면 중독·강박·이명 고통 같은 악순환이 됩니다. 이 이론은 그 두 갈래를 하나의 틀로 설명하고, 갇힌 중요도를 옮기는 상담 방법으로 이어집니다.
    note: ""
  - title: 시대심리학
    subtitle: 가칭 · 연구 구상 중
    desc: 시대마다 사람을 적응하게 하는 핵심 가치가 다릅니다. 같은 사회 안에서도 자기 시대를 얼마나 이해하느냐에 따라 삶의 결과가 갈리고, 이전 시대의 눈으로 지금을 읽을 때 세대 갈등이 생깁니다. 우리는 '시대 이해도'라는 개인차를 측정하고, 그것이 적응을 예측하는지 연구합니다.
    note: ""


